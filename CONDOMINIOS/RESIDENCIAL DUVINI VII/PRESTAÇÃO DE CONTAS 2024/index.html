
    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RESIDENCIAL DUVINI VII- CNPJ 41.173.925/0001-11</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
        <style>
            body { background: #1a1a1a; color: white; font-family: sans-serif; margin: 0; text-align: center; }
            #lock-screen { position: fixed; inset: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
            .login-box { background: #222; padding: 30px; border-radius: 10px; width: 85%; max-width: 400px; border: 1px solid #444; }
            input { padding: 15px; width: 85%; font-size: 18px; margin-bottom: 20px; border-radius: 5px; border: none; }
            #content { display: none; flex-direction: column; align-items: center; width: 100%; }
            .header { padding: 20px; background: #222; width: 100%; border-bottom: 3px solid #f1c40f; box-sizing: border-box; }
            canvas { width: 95%; max-width: 900px; margin: 10px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: white; }
        </style>
    </head>
    <body>
    <div id="lock-screen">
        <div class="login-box">
            <h2 style="color:#f1c40f">PRESTAÇÃO DE CONTAS 2024</h2>
            <h3>RESIDENCIAL DUVINI VII- CNPJ 41.173.925/0001-11</h3>
            <p>PRESTAÇÃO DE CONTAS 2024</p>
            <input type="password" id="pass" placeholder="Senha de Acesso">
            <button onclick="check()" style="padding:15px; background:#27ae60; color:white; border:none; border-radius:5px; width:95%; cursor:pointer; font-weight:bold;">ABRIR DOCUMENTOS</button>
        </div>
    </div>
    <div id="content">
        <div class="header"><h1>PRESTAÇÃO DE CONTAS 2024</h1><h2>RESIDENCIAL DUVINI VII- CNPJ 41.173.925/0001-11</h2><p>PRESTAÇÃO DE CONTAS 2024</p></div>
        <div id="viewer"></div>
    </div>
    <script>
        const docs = ['pag_01_35abe525.pdf'];
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        function check() {
            if(document.getElementById('pass').value === 'x31XLFzTMN') {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('content').style.display = 'flex';
                renderAll();
            } else { alert('Senha incorreta!'); }
        }

        async function renderAll() {
            const container = document.getElementById('viewer');
            for (const file of docs) {
                try {
                    const pdf = await pdfjsLib.getDocument(file).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        container.appendChild(canvas);
                    }
                } catch (e) { console.error(e); }
            }
        }
    </script>
    </body>
    </html>
